# GitLab Integration Configuration Example
# This example shows how to configure GitLab integration

redmine:
  url: "https://redmine.example.com"
  display_url: ""  # Optional: external access URL
  api_key: "your-redmine-api-key-here"

  projects:
    # Example 1: Sync to GitLab only
    - identifier: "project-a"
      custom_fields:
        target_gitlab_project_id: 12    # Redmine custom field ID for GitLab Project
        gitlab_issue_url_id: 13         # Redmine custom field ID for GitLab Issue URL
      sync_to:
        github: false
        gitlab: true

    # Example 2: Sync to both GitHub and GitLab
    - identifier: "project-b"
      custom_fields:
        target_repo_id: 10              # GitHub repo field
        github_issue_url_id: 11         # GitHub issue URL field
        target_gitlab_project_id: 12    # GitLab project field
        gitlab_issue_url_id: 13         # GitLab issue URL field
      sync_to:
        github: true
        gitlab: true

    # Example 3: GitHub only (backward compatible)
    - identifier: "project-c"
      custom_fields:
        target_repo_id: 10
        github_issue_url_id: 11
      sync_to:
        github: true
        gitlab: false

# GitHub Configuration (Optional - only if syncing to GitHub)
github:
  token: "ghp_your_github_token_here"
  base_url: "https://github.com"

# GitLab Configuration (Optional - only if syncing to GitLab)
gitlab:
  token: "glpat-your_gitlab_token_here"    # GitLab Personal Access Token
  base_url: "https://gitlab.com"            # Or your self-hosted GitLab URL
  api_version: "v4"                         # GitLab API version (default: v4)

# Sync Configuration
sync:
  interval: "5m"                    # Sync interval
  title_format: "[Redmine #%d] %s"  # Issue title format
  on_error:
    log: true
    add_redmine_note: true
    log_file: "/app/logs/sync.log"

# Database Configuration
database:
  host: "localhost"
  port: 5432
  name: "redmine"
  user: "redmine"
  password: "redmine"
  schema: "redmine_github_sync"
  sslmode: "disable"

# Notes:
# 1. GitLab Personal Access Token requires 'api' scope
# 2. GitLab project can be specified as:
#    - Numeric ID: "12345" (recommended)
#    - Namespace/Project: "mygroup/myproject"
# 3. To get GitLab Project ID: Click ⋮ menu > "Copy project ID"
# 4. At least one of github.token or gitlab.token must be configured
# 5. If sync_to is not specified, defaults to GitHub (backward compatible)
